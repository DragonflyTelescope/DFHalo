[project]
name = "dfhalo"
version = "0.1.0"
description = "Halo Assessment for single exposures taken by Dragonfly"
authors = [
    {name = "Qing Liu", email = "qliu@astro.utoronto.ca" }
]
requires-python = ">=3.7"
dependencies = [
    "astropy>=4.0",
    "matplotlib>=3",
    "numpy>=1.17",
    "photutils>=0.7.2",
    "scikit-learn>=0.24.2",
    "scipy>=1.6.0",
    "tqdm>=4.65.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
